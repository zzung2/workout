<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈트 체크리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1f2a24;--sub:#6b7a70;--line:#dbe3dc;--accent:#2f7d5b;--accent-ink:#fff;--warn:#d98b2b;--fail:#b9503f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--card:#1e2823;--ink:#e8efe9;--sub:#93a69a;--line:#33423a;--accent:#5fbf92;--accent-ink:#0f1a14;--warn:#e0a24d;--fail:#e07b68}}
:root[data-theme="dark"]{--bg:#141b17;--card:#1e2823;--ink:#e8efe9;--sub:#93a69a;--line:#33423a;--accent:#5fbf92;--accent-ink:#0f1a14;--warn:#e0a24d;--fail:#e07b68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.week{display:flex;gap:6px;margin-bottom:12px}
.week button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.week button small{font-size:11px;color:var(--sub)}
.week button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week button.sel small{color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:transparent}
.dot.ok{background:var(--accent)}.dot.part{background:var(--warn)}
.week .sel .dot.ok,.week .sel .dot.part{background:var(--accent-ink)}
.date{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.plan{font-size:19px;margin:6px 0 0}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge.part{background:var(--warn);color:#fff;border-color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.row input[type=text],textarea,.w input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.row input.done{text-decoration:line-through;color:var(--sub)}
textarea{width:100%;resize:vertical;min-height:60px}
.w{display:flex;align-items:center;gap:8px}
.w input{max-width:120px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--sub)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:360px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:normal}
tr.cur td{background:var(--bg)}
svg{width:100%;height:auto;display:block}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.addbtn{font:inherit;margin-top:8px;padding:8px 12px;width:100%;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:10px;cursor:pointer}
.del{font:inherit;flex:none;width:32px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;cursor:pointer}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}

/* 모바일 전용 보정 */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden;min-height:100vh;min-height:100dvh}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom,0px));max-width:480px}
h1{font-size:20px;margin:2px 2px 10px}
.card{padding:14px 12px;border-radius:16px}
.week{gap:4px}
.week button{min-width:0;padding:8px 0;min-height:58px;-webkit-tap-highlight-color:transparent}
.date{gap:6px}
.date input{flex:1;min-width:0;min-height:44px;text-align:center;-webkit-appearance:none;appearance:none;font-size:16px}
.date button{flex:none;width:44px;height:44px;font:inherit;font-size:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.planrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.plan{font-size:17px;margin:0;min-width:0}
.badge{flex:none}
.row{min-height:52px;gap:8px}
.row input[type=checkbox]{width:28px;height:28px}
.row input[type=text]{min-height:44px;font-size:16px}
.del{width:40px;height:40px}
.addbtn{min-height:48px}
.w input{min-height:44px}
textarea{font-size:16px}
table{min-width:0;font-size:13px;table-layout:fixed}
th,td{padding:7px 2px}
.stats b{font-size:20px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>홈트 체크리스트</h1>
<noscript><div class="card">이 화면에서는 체크리스트가 작동하지 않아요. 저장된 파일 미리보기가 아니라 게시된 링크를 Safari나 Claude 앱에서 열어 주세요.</div></noscript>
<div class="week" id="week"></div>

<div class="card">
  <div class="date"><button id="prev" aria-label="전날">‹</button><input type="date" id="date"><button id="next" aria-label="다음날">›</button></div>
  <div class="planrow"><p class="plan" id="plan"></p><span class="badge" id="status"></span></div>
</div>

<div class="card">
  <h2>오늘 체중</h2>
  <div class="w"><input type="number" id="weight" step="0.1" inputmode="decimal" placeholder="0.0"><span>kg</span><span class="hint" id="diff"></span></div>
  <div class="w" style="margin-top:10px"><span>목표</span><input type="number" id="goal" step="0.1" inputmode="decimal" placeholder="0.0" style="font-size:16px;max-width:100px"><span>kg</span><span class="hint" id="goaltxt"></span></div>
</div>

<div class="card">
  <h2>오늘 운동</h2>
  <div id="items"></div>
  <button id="add" class="addbtn">+ 운동 항목 추가</button>
  <p class="hint">기본 운동 1개가 들어 있어요. 더 한 운동이 있으면 추가하세요. 항목을 모두 체크하면 성공입니다.</p>
</div>

<div class="card">
  <h2>메모</h2>
  <textarea id="memo" placeholder="컨디션, 느낀 점, 다음에 바꿀 것"></textarea>
</div>

<div class="card">
  <h2>기록 요약</h2>
  <div class="stats">
    <div><b id="s1">0</b><span>이번 주 성공</span></div>
    <div><b id="s2">0</b><span>연속 성공일</span></div>
    <div><b id="s3">-</b><span>시작 대비 체중</span></div>
  </div>
</div>

<div class="card">
  <h2>체중 변화</h2>
  <div id="chart"></div>
</div>

<div class="card">
  <h2>최근 14일</h2>
  <div><table><thead><tr><th>날짜</th><th>요일</th><th>체중</th><th>운동</th><th>결과</th></tr></thead><tbody id="log"></tbody></table></div>
  <div class="btns"><button id="reset">전체 기록 지우기</button></div>
</div>
</main>

<script>
(function(){
var DAYS=['일','월','화','수','목','금','토'];
var PLAN=['휴식','하체 + 엉덩이','팔뚝 + 등 + 복부','전신 스트레칭','하체 + 복부','상체 + 전신','전신 스트레칭'];
var KEY='hometraining-tracker-v1';
var data={};
try{var raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)||{};}catch(e){data={};}
var GKEY=KEY+'-goal',goal='';
try{goal=localStorage.getItem(GKEY)||'';}catch(e){}
var DEF1=['','하체 + 엉덩이 운동','팔뚝 + 등 + 복부 운동','전신 스트레칭','하체 + 복부 운동','상체 + 전신 운동','전신 스트레칭'];
var DEF=[[],
['하체 운동 영상','엉덩이 운동 영상','마무리 스트레칭'],
['팔뚝 운동 영상','등 운동 영상','복부 운동 영상'],
['목·어깨 스트레칭','하체 스트레칭','전신 스트레칭'],
['하체 운동 영상','복부 운동 영상','마무리 스트레칭'],
['상체 운동 영상','전신 운동 영상','마무리 스트레칭'],
['목·어깨 스트레칭','하체 스트레칭','전신 스트레칭']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function iso(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
var today=iso(new Date());
var cur=today;
function rec(k){
  var d=dow(k),r=data[k];
  if(!r)return {w:'',items:[{t:DEF1[d],d:false}],memo:''};
  if(!r.v2){ // 이전 버전(3개 고정) 기록 정리: 안 한 기본 항목은 제거
    r.items=r.items.filter(function(it,i){return i===0||it.d||(it.t&&it.t!==DEF[d][i]);});
    if(!r.items.length)r.items=[{t:'',d:false}];
    r.v2=true;
  }
  if(!r.items[0].t)r.items[0].t=DEF1[d];
  return r;
}
function dow(k){return parse(k).getDay();}
function state(k){
  var r=data[k];var rest=dow(k)===0;
  if(rest)return r&&r.rest===false?'':'rest';
  if(!r)return '';
  var n=r.items.filter(function(i){return i.d}).length;
  return n===r.items.length?'ok':n>0?'part':'';
}
function $(id){return document.getElementById(id);}
function weekDates(k){
  var d=parse(k),off=(d.getDay()+6)%7,mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off),a=[];
  for(var i=0;i<7;i++)a.push(iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)));
  return a;
}
function renderWeek(){
  var h='';
  weekDates(cur).forEach(function(k){
    var s=state(k);
    h+='<button data-k="'+k+'" class="'+(k===cur?'sel':'')+'"><span>'+DAYS[dow(k)]+'</span><small>'+parse(k).getDate()+'</small><span class="dot '+(s==='ok'?'ok':s==='part'?'part':'')+'"></span></button>';
  });
  $('week').innerHTML=h;
  Array.prototype.forEach.call($('week').children,function(b){b.onclick=function(){cur=b.getAttribute('data-k');render();};});
}
function renderDay(){
  var r=rec(cur),d=dow(cur),rest=d===0;
  $('date').value=cur;
  $('plan').textContent=DAYS[d]+'요일 · '+PLAN[d];
  $('weight').value=r.w;
  $('memo').value=r.memo||'';
  var h='';
  if(rest){h='<p class="hint" style="font-size:14px">일요일은 쉬는 날이에요. 푹 쉬세요.</p>';}
  else r.items.forEach(function(it,i){
    h+='<div class="row"><input type="checkbox" data-i="'+i+'"'+(it.d?' checked':'')+' aria-label="운동 '+(i+1)+' 완료"><input type="text" data-t="'+i+'" class="'+(it.d?'done':'')+'" placeholder="운동 이름 (예: 플랭크 3세트)" value="'+(it.t||'').replace(/"/g,'&quot;')+'">'+(i>0?'<button class="del" data-del="'+i+'" aria-label="항목 삭제">×</button>':'')+'</div>';
  });
  $('items').innerHTML=h;
  $('add').style.display=rest?'none':'block';
  Array.prototype.forEach.call($('items').querySelectorAll('input[type=checkbox]'),function(c){c.onchange=function(){var x=rec(cur);x.items[+c.getAttribute('data-i')].d=c.checked;data[cur]=x;save();render();};});
  Array.prototype.forEach.call($('items').querySelectorAll('input[type=text]'),function(t){t.oninput=function(){var x=rec(cur);x.items[+t.getAttribute('data-t')].t=t.value;data[cur]=x;save();};});
  Array.prototype.forEach.call($('items').querySelectorAll('.del'),function(b){b.onclick=function(){var x=rec(cur);x.items.splice(+b.getAttribute('data-del'),1);data[cur]=x;save();render();};});
  var s=state(cur),b=$('status');
  b.className='badge '+(s==='ok'?'ok':s==='part'?'part':'');
  b.textContent=s==='ok'?'성공':s==='part'?'진행 중':s==='rest'?'휴식일':'미완료';
  $('goal').value=goal;
  var g=parseFloat(goal),lw=lastWeightBefore('9999-12-31');
  $('goaltxt').textContent=(!isNaN(g)&&lw!==null)?(Math.abs(lw-g)<0.05?'목표 달성!':(lw>g?'목표까지 '+(lw-g).toFixed(1)+'kg 남음':'목표보다 '+(g-lw).toFixed(1)+'kg 낮음')):'';
  var prev=lastWeightBefore(cur),w=parseFloat(r.w);
  $('diff').textContent=(!isNaN(w)&&prev!==null)?('전날 대비 '+((w-prev)>0?'+':'')+(w-prev).toFixed(1)+'kg'):'';
}
function lastWeightBefore(k){
  var keys=Object.keys(data).filter(function(x){return x<k&&!isNaN(parseFloat(data[x].w));}).sort();
  return keys.length?parseFloat(data[keys[keys.length-1]].w):null;
}
function renderStats(){
  var wk=weekDates(cur).filter(function(k){return dow(k)!==0&&state(k)==='ok';}).length;
  $('s1').textContent=wk+'/6';
  var streak=0,d=parse(today);
  for(var i=0;i<400;i++){
    var k=iso(d),s=state(k);
    if(s==='ok'||(s==='rest'&&!(k===today&&false))){ if(s==='ok')streak++; }
    else if(k===today&&s!=='ok'){ /* 오늘 미완료는 건너뜀 */ }
    else break;
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);
  }
  $('s2').textContent=streak;
  var ws=Object.keys(data).filter(function(x){return !isNaN(parseFloat(data[x].w));}).sort();
  if(ws.length>1){var df=parseFloat(data[ws[ws.length-1]].w)-parseFloat(data[ws[0]].w);$('s3').textContent=(df>0?'+':'')+df.toFixed(1)+'kg';}else $('s3').textContent='-';
}
function renderChart(){
  var ks=Object.keys(data).filter(function(x){return !isNaN(parseFloat(data[x].w));}).sort().slice(-30);
  if(ks.length<2){$('chart').innerHTML='<p class="hint">체중을 이틀 이상 기록하면 그래프가 나타나요.</p>';return;}
  var v=ks.map(function(k){return parseFloat(data[k].w);}),g=parseFloat(goal),hasG=!isNaN(g),mn=Math.min.apply(null,hasG?v.concat(g):v)-0.5,mx=Math.max.apply(null,hasG?v.concat(g):v)+0.5;
  var W=500,H=170,p=28,pts=v.map(function(y,i){return[p+i*(W-2*p)/(v.length-1),H-p-(y-mn)/(mx-mn)*(H-2*p)];});
  var path=pts.map(function(q,i){return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ');
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="체중 변화 그래프">';
  if(hasG){var gy=H-p-(g-mn)/(mx-mn)*(H-2*p);s+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-p)+'" y="'+(gy-5).toFixed(1)+'" font-size="12" text-anchor="end" fill="var(--warn)">목표 '+g+'kg</text>';}
  s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(q){s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>';});
  s+='<text x="4" y="'+(p+4)+'" font-size="12" fill="var(--sub)">'+mx.toFixed(1)+'</text><text x="4" y="'+(H-p+4)+'" font-size="12" fill="var(--sub)">'+mn.toFixed(1)+'</text>';
  s+='<text x="'+p+'" y="'+(H-6)+'" font-size="12" fill="var(--sub)">'+ks[0].slice(5)+'</text><text x="'+(W-p)+'" y="'+(H-6)+'" font-size="12" text-anchor="end" fill="var(--sub)">'+ks[ks.length-1].slice(5)+'</text></svg>';
  $('chart').innerHTML=s;
}
function renderLog(){
  var h='',d=parse(today);
  for(var i=0;i<14;i++){
    var k=iso(d),r=data[k],s=state(k),n=r?r.items.filter(function(x){return x.d}).length:0;
    h+='<tr'+(k===cur?' class="cur"':'')+'><td>'+k.slice(5)+'</td><td>'+DAYS[dow(k)]+'</td><td>'+((r&&r.w!=='')?r.w:'-')+'</td><td>'+(s==='rest'?'-':n+'/'+(r?r.items.length:1))+'</td><td>'+(s==='ok'?'성공':s==='part'?'일부':s==='rest'?'휴식':'-')+'</td></tr>';
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);
  }
  $('log').innerHTML=h;
}
function render(){renderWeek();renderDay();renderStats();renderChart();renderLog();}
$('date').onchange=function(){if(this.value){cur=this.value;render();}};
function shift(n){var d=parse(cur);cur=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));render();}
$('prev').onclick=function(){shift(-1);};$('next').onclick=function(){shift(1);};
$('add').onclick=function(){var x=rec(cur);x.items.push({t:'',d:false});data[cur]=x;save();render();var ts=$('items').querySelectorAll('input[type=text]');if(ts.length)ts[ts.length-1].focus();};
$('goal').oninput=function(){goal=this.value;try{localStorage.setItem(GKEY,goal);}catch(e){}renderDay();renderChart();};
$('weight').oninput=function(){var x=rec(cur);x.w=this.value;data[cur]=x;save();renderStats();renderChart();renderLog();};
$('memo').oninput=function(){var x=rec(cur);x.memo=this.value;data[cur]=x;save();};
$('reset').onclick=function(){if(confirm('모든 기록을 지울까요? 되돌릴 수 없어요.')){data={};save();render();}};
render();
})();
</script>
</body>
</html>
